<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>QR Meeting Join</title>
    <!-- Static app configuration values for this project. -->
    <script src="app-config.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="top">
      <span class="top__title" id="app-product">QR Meeting Join</span>
      <button class="link" id="sign-out" type="button" hidden>Sign out</button>
    </header>

    <main class="main">
      <p class="banner" id="banner" role="status" aria-live="polite" hidden></p>

      <section class="card" id="view-signin" hidden>
        <h1 id="signin-heading">Sign in to join</h1>
        <p id="signin-text">
          Sign in with your Webex account to see your meetings.
        </p>
        <button class="primary" id="sign-in" type="button">
          Sign in with Webex
        </button>
      </section>

      <section id="view-meetings" hidden>
        <h1 id="meetings-heading">Your meetings</h1>
        <p class="muted" id="meetings-hint"></p>
        <ul class="meetings" id="meeting-list"></ul>
        <button class="secondary" id="refresh" type="button">Refresh</button>
      </section>

      <section class="card" id="view-done" hidden>
        <h1>Request sent</h1>
        <p id="done-text"></p>
        <p class="muted">
          If nothing happens within a few seconds, scan the QR code on the
          screen again and retry.
        </p>
        <button class="secondary" id="done-back" type="button">Back</button>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
